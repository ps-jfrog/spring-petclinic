    needs: requirePackageSuccess
    runs-on: ubuntu-latest
    env:
      ENV_VAL: "DEV"
      APPLICATION_VERSION: "${{ needs.requirePackageSuccess.outputs.mvn_application_version }}"
    defaults:
       run:
         working-directory: "${{env.DEFAULT_WORKSPACE}}"
    steps:
      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@v5
        id: setup-cli
        env:
