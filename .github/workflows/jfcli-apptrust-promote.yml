  summaryAppPromote:
    name: "Summary AppPromote"
    needs: 
      - requirePackageSuccess
      - dockerAppPromote2Prod
      - mvnAppPromote2Prod
      - gradleAppPromote2Prod
    runs-on: ubuntu-latest
    env:
      MAX_BUILDS: 25 # The maximum number of builds to store in Artifactory
    defaults:
       run:
         working-directory: "${{env.DEFAULT_WORKSPACE}}"
    steps:
