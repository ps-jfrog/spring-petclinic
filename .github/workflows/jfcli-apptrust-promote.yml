          version: latest  #2.71.0
          oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          disable-job-summary: ${{env.JOB_SUMMARY}}

      - name: "Promotion Summary"
        run: |
          echo "# :frog: :ship: AppTrust: Promote - Summary :pushpin:" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " - Application: [${{env.APPLICATION_KEY}}](https://${{vars.JF_NAME}}.jfrog.io/ui/apptrust/applications/${{env.APPLICATION_KEY}}?projectKey=${{env.PROJECT_KEY}}) " >> $GITHUB_STEP_SUMMARY
