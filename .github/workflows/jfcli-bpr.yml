name: "BPR: Package"
on: push
permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  contents: read
  security-events: write # Required for uploading code scanning.
  attestations: write
  artifact-metadata: write
  issues: write
env:
  JF_RT_URL: "https://${{vars.JF_NAME}}.jfrog.io"
  BUILD_NAME: "spring-petclinic" # spring-petclinic-3.5.0-SNAPSHOT.jar
  PROJECT_KEY: "ps-build-promote"
  JOB_SUMMARY: false
  CLI_LOG_LEVEL: DEBUG # DEBUG, INFO, WARN, ERROR
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '25'
  #RBV2_SIGNING_KEY: "${{secrets.RBV2_SIGNING_KEY}}" # ref https://jfrog.com/help/r/jfrog-artifactory-documentation/create-signing-keys-for-release-bundles-v2
  DEFAULT_WORKSPACE: "${{github.workspace}}"  # /home/runner/work/spring-petclinic/spring-petclinic

jobs:
  dockerPackage:
    name: "Docker Package"
    env:  
      BUILD_ID: "dkr-${{github.run_number}}"
      RT_REPO_VIRTUAL: "bpr-spring-petclinic-docker-virtual"
      RT_REPO_LOCAL_DEFAULT: "bpr-spring-petclinic-docker-init-local"
      RT_REPO_LOCAL_DEV: "bpr-spring-petclinic-docker-dev-local"
      RT_REPO_LOCAL_QA: "bpr-spring-petclinic-docker-qa-local"
      RT_REPO_LOCAL_PROD: "bpr-spring-petclinic-docker-prod-local"
      # RT_REPO_REMOTE: default-docker-remote
      RT_REPO_MVN_VIRTUAL: "bpr-spring-petclinic-mvn-virtual"
      DOCKER_BUILDX_PLATFORMS: 'linux/amd64,linux/arm64'
      DOCKER_METADATA_JSON: 'build-metadata.json'
    defaults:
       run:
         working-directory: "${{env.DEFAULT_WORKSPACE}}"
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ref  https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idtimeout-minutes
    steps:
      - uses: muldos/ci-traffic-monitor@v1
        with:
          detailed: 'true'
      # Use the specific setup-cli branch. Ref https://github.com/marketplace/actions/setup-jfrog-cli
      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@v5
        id: setup-cli
        env:
          JF_URL: ${{env.JF_RT_URL}}
          JF_PROJECT: "${{env.PROJECT_KEY}}"
          JFROG_CLI_LOG_LEVEL: "${{env.CLI_LOG_LEVEL}}"
          JFROG_CLI_RELEASES_REPO: '${{env.JF_RT_URL}}/artifactory/${{env.RT_REPO_MVN_VIRTUAL}}' 
          JFROG_CLI_EXTRACTORS_REMOTE: '${{env.JF_RT_URL}}/artifactory/${{env.RT_REPO_MVN_VIRTUAL}}'
          JF_GIT_TOKEN: ${{secrets.GITHUB_TOKEN}}      
        with:
          version: latest  #2.71.0
          oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          disable-job-summary: ${{env.JOB_SUMMARY}}

      - name: "Clone VCS"
        uses: actions/checkout@v6 # ref: https://github.com/actions/checkout

      - name: "setUp JDK provider = ${{env.JAVA_DISTRIBUTION}} with ver = ${{env.JAVA_VERSION}}"
        uses: actions/setup-java@v5  # ref https://github.com/actions/setup-java
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}} # temurin
          java-version: ${{env.JAVA_VERSION}}  # 25
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: "Software version"
        run: |
          # JFrog CLI version
          jf --version
          # Ping the server
          jf rt ping
          # Java
          java -version
          # MVN
          mvn -version
          # Docker
          docker -v
          # jf config
          jf config show

      - name: "Config jf with mvn repos"
        run: |
          jf mvnc --global --repo-resolve-releases ${{env.RT_REPO_MVN_VIRTUAL}} --repo-resolve-snapshots ${{env.RT_REPO_MVN_VIRTUAL}}

      - name: "Create ENV variables"
        run: |
          echo "ARTIFACT_NAME=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "SHORT_COMMIT_CODE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TODAYS_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "RT_REPO_DOCKER_IMG=${{env.RT_REPO_VIRTUAL}}/${{env.BUILD_NAME}}" >> $GITHUB_ENV
          # docker/login-action expects a registry host, not https:// or a repo path
          echo "JF_REGISTRY=${{vars.JF_NAME}}.jfrog.io" >> $GITHUB_ENV
          echo "RT_REPO_DOCKER_URL=${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_VIRTUAL}}/${{env.BUILD_NAME}}:${{env.BUILD_ID}}" >> $GITHUB_ENV

      - name: "Docker authentication"  # ref https://github.com/marketplace/actions/docker-login
        id: config-docker
        uses: docker/login-action@v4
        with: 
          registry: ${{env.JF_REGISTRY}}
          username: ${{steps.setup-cli.outputs.oidc-user}}
          password: ${{steps.setup-cli.outputs.oidc-token}}

      - name: "Docker: QEMU (cross-arch)"
        uses: docker/setup-qemu-action@v4

      - name: "Docker buildx instance"
        uses: docker/setup-buildx-action@v4   # ref: https://github.com/marketplace/actions/docker-setup-buildx h
        with:
          use: true
          # Multi-platform requires docker-container driver (or containerd image store); plain docker driver cannot push multi-arch.
          driver: docker-container
          platforms: ${{env.DOCKER_BUILDX_PLATFORMS}} # linux/amd64,linux/arm64 # ref: https://docs.docker.com/reference/cli/docker/buildx/create/#platform

      
      # Package
      - name: "Curation-Audit: docker image" # https://docs.jfrog-applications.jfrog.io/jfrog-applications/jfrog-cli/cli-for-jfrog-security/cli-for-jfrog-curation
        timeout-minutes: 15    # ref https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepstimeout-minutes
        continue-on-error: true    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepscontinue-on-error
        run: |
          rm -rf build.gradle 
          jf ca --format=table --threads=100 --image=${{vars.JF_NAME}}.jfrog.io/springpetclinic-docker-virtual/amazoncorretto:25-alpine-jdk

      - name: "Curation-Audit: MVN" 
        timeout-minutes: 15   
        continue-on-error: true   
        run: |
          rm -rf build.gradle 
          jf ca --format=table --threads=100 

      - name: "Xray & JAS: Audit"  # https://docs.jfrog-applications.jfrog.io/jfrog-applications/jfrog-cli/cli-for-jfrog-security
        # scan for Xray: Source code dependencies and JAS: Secrets Detection, IaC, Vulnerabilities Contextual Analysis 'SAST'
        timeout-minutes: 15  # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepstimeout-minutes
        continue-on-error: true    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepscontinue-on-error
        run: |
          jf audit --mvn --sast=true --sca=true --secrets=true --licenses=true --validate-secrets=true --vuln=true --format=table --extended-table=true --threads=100 --fail=false --project="${{env.PROJECT_KEY}}"

      - name: "Package: Create MVN Build"
          # jf mvn clean install -DskipTests=true -Denforcer.skip=true --build-name=${{env.BUILD_NAME}} --build-number=${{env.BUILD_ID}}
        run: |     # -Djar.finalName=${{env.JAR_FINAL_NAME}} 
          mvn clean install -DskipTests=true -Denforcer.skip=true

      - name: "Package: Xray - mvn Artifact scan"
        timeout-minutes: 15  # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepstimeout-minutes
        continue-on-error: true    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepscontinue-on-error
        run: |
          jf scan . --format=table --extended-table=true --threads=100 --fail=false --vuln=true --project="${{env.PROJECT_KEY}}" 

      - name: "Package: Docker build and push"
        env:
          DOCKER_FILE: "./jfrog/BPRDockerfile"
          JAR_FILE: "./target/${{env.ARTIFACT_NAME}}-${{env.ARTIFACT_VERSION}}.jar"
          TAG10: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_VIRTUAL}}/${{env.ARTIFACT_NAME}}:${{env.ARTIFACT_VERSION}}"
          TAG11: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_VIRTUAL}}/${{env.ARTIFACT_NAME}}:${{env.SHORT_COMMIT_CODE}}"
          TAG12: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_VIRTUAL}}/${{env.ARTIFACT_NAME}}:${{env.TODAYS_DATE}}" 
          TAG13: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_VIRTUAL}}/${{env.ARTIFACT_NAME}}:${{env.BUILD_ID}}"
          TAG14: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_VIRTUAL}}/${{env.ARTIFACT_NAME}}:latest"
        run: |
          docker buildx build -f ${{env.DOCKER_FILE}} --build-arg JAR_FILE=${{env.JAR_FILE}} --platform "${{env.DOCKER_BUILDX_PLATFORMS}}" --metadata-file "${{env.DOCKER_METADATA_JSON}}" --push -t ${{env.TAG10}} -t ${{env.TAG11}} -t ${{env.TAG12}} -t ${{env.TAG13}} -t ${{env.TAG14}} .

      - name: "Optional: Docker pull image"
        run: |
          docker pull ${{env.RT_REPO_DOCKER_URL}}

      - name: "Package: Docker image list"
        run: |
          docker image ls

      # Evidence - Package references
      #     Docs# https://jfrog.com/help/r/jfrog-artifactory-documentation/evidence-management
      #     CLI# https://docs.jfrog-applications.jfrog.io/jfrog-applications/jfrog-cli/binaries-management-with-jfrog-artifactory/evidence-service
      - name: "Evidence: Package"
        continue-on-error: true 
        env:
          EVD_SPEC_JSON: './dkr-evd-package-spec-info.json'  # ref https://jfrog.com/help/r/jfrog-artifactory-documentation/evidence-setup
          PREDICATE_TYPE: "https://jfrog.com/evidence/signature/v1"
        run: |
          echo '{ "actor": "${{github.actor}}", "pipeline": "github actions","build_name": "${{env.BUILD_NAME}}", "build_id": "${{env.BUILD_ID}}", "evd":"Evidence-Package", "package":"${{env.RT_REPO_DOCKER_URL}}" }' > ${{env.EVD_SPEC_JSON}}
          cat ${{env.EVD_SPEC_JSON}}
          jf evd create --package-name="${{env.BUILD_NAME}}" --package-version="${{env.BUILD_ID}}" --package-repo-name="${{env.RT_REPO_VIRTUAL}}" --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}"  --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" --predicate="${{env.EVD_SPEC_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}" --project="${{env.PROJECT_KEY}}"

      - name: "Package: Xray - docker Artifact scan"
        timeout-minutes: 15    # ref https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepstimeout-minutes
        continue-on-error: true    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepscontinue-on-error
        run: |
          jf docker scan ${{env.RT_REPO_DOCKER_URL}} --build-name ${{env.BUILD_NAME}} --build-number ${{env.BUILD_ID}} --format=table --extended-table=true --threads=100 --fail=false  --detailed-summary=true  --vuln=true --licenses=true --project="${{env.PROJECT_KEY}}"
      
      - name: "Optional: Set env vars for BuildInfo"   # These properties were captured in Builds >> spring-petclinic >> version >> Environment tab
        run: |
          export job="github-action" org="ps" team="architecture" product="jfrog-saas" project="${{env.PROJECT_KEY}}"

      # Build Info
          # US 
          #     Executive Order: 
          #       https://www.whitehouse.gov/briefing-room/presidential-actions/2021/05/12/executive-order-on-improving-the-nations-cybersecurity/
          #       https://www.nist.gov/itl/executive-order-14028-improving-nations-cybersecurity
          #    US Dept of Commerce: https://www.ntia.gov/page/software-bill-materials
          #    US Cyber Defence Agency: https://www.cisa.gov/sbom
          #    NIST: https://www.nist.gov/itl/executive-order-14028-improving-nations-cybersecurity/software-security-supply-chains-software-1
          #    NITA: https://www.ntia.gov/page/software-bill-materials 
          #    Centers for Medicare & Medicaid Services: https://security.cms.gov/learn/software-bill-materials-sbom
          # India
          #    CERT-IN: https://www.cert-in.org.in/sbom/
      - name: "BuildInfo: Docker build create"
        run: |
          imageDigest=$(jq -r '.["containerimage.digest"]' "${{env.DOCKER_METADATA_JSON}}")
          echo "DOCKER_IMAGE_DIGEST: ${imageDigest}"
          echo "DOCKER_IMAGE_DIGEST=${imageDigest}" >> "$GITHUB_ENV"

          echo "${{env.RT_REPO_DOCKER_URL}}@${imageDigest}" > "${{env.DOCKER_METADATA_JSON}}"

          jf rt bdc ${{env.RT_REPO_VIRTUAL}} --image-file ${{env.DOCKER_METADATA_JSON}} --build-name=${{env.BUILD_NAME}} --build-number=${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"

      - name: "BuildInfo: Build Publish"
        run: |
          jf rt bce ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"
          # jf rt bad ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"
          jf rt bag ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}" 
          jf rt bp ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}" --detailed-summary=true 

      # Evidence - Build references
      #     Docs# https://jfrog.com/help/r/jfrog-artifactory-documentation/evidence-management
      #     CLI# https://docs.jfrog-applications.jfrog.io/jfrog-applications/jfrog-cli/binaries-management-with-jfrog-artifactory/evidence-service
      - name: "Evidence: Build Publish"
        continue-on-error: true 
        env:
          EVD_SPEC_JSON: './dkr-evd-bp-spec-info.json'  # ref https://jfrog.com/help/r/jfrog-artifactory-documentation/evidence-setup
          PREDICATE_TYPE: "https://jfrog.com/evidence/build-signature/v1"
        run: |
          echo '{ "actor": "${{github.actor}}", "pipeline": "github actions","build_name": "${{env.BUILD_NAME}}", "build_id": "${{env.BUILD_ID}}", "evd": "Evidence-BuildPublish"}' > ${{env.EVD_SPEC_JSON}}
          cat ${{env.EVD_SPEC_JSON}}
          jf evd create --build-name="${{env.BUILD_NAME}}" --build-number="${{env.BUILD_ID}}" --predicate="${{env.EVD_SPEC_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}" --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}" --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" --project="${{env.PROJECT_KEY}}"

      # curl -L 'https://psazuse.jfrog.io/xray/api/v1/binMgr/builds' -H 'Content-Type: application/json' -H 'Authorization: ••••••' -d '{  "names": ["spring-petclinic"] }'
      - name: "Optional: Add Builds to Indexing Configuration"
        continue-on-error: true 
        run: |
          jf xr curl "/api/v1/binMgr/builds" -H 'Content-Type: application/json' -d '{"names": ["${{env.BUILD_NAME}}"] }'
      # Set properties      
      - name: "Optional: Set prop for Artifact"  # These properties were captured Artifacts >> repo path 'spring-petclinic.---.jar' >> Properties
        run: |
          ts="cmd.$(date '+%Y-%m-%d-%H-%M')"
          jf rt sp "job=github-action;env=demo;org=ps;team=arch;pack_cat=webapp;build=maven;product=artifactory;features=package,buildinfo;ts=${ts}" --build="${{env.BUILD_NAME}}/${{env.BUILD_ID}}" --project="${{env.PROJECT_KEY}}"

      - name: "Optional: Query build info"
        env: 
          BUILD_INFO_JSON: "BuildInfo-${{env.BUILD_ID}}.json"
        run: |
           jf rt curl "/api/build/${{env.BUILD_NAME}}/${{env.BUILD_ID}}" -o $BUILD_INFO_JSON
           cat $BUILD_INFO_JSON

      # - name: "Sleep for few seconds"
      #   env: 
      #     SLEEP_TIME: 20
      #   run: |
      #      echo "Sleeping for ${{env.SLEEP_TIME}} seconds..."
      #      sleep ${{env.SLEEP_TIME}}  # Sleeping for 20 seconds before executing the build publish seems to have resolved the build-scan issue. This delay might be helping with synchronization or resource availability, ensuring a smooth build process.
      #      echo "Awake now!"

      - name: "Optional: Query - Build Scan status"
        run: |
          jf xr curl "/api/v1/build/status" -H 'Content-Type: application/json' -d '{"name": "${{env.BUILD_NAME}}", "number": "${{env.BUILD_ID}}" }'
 
      # ref https://docs.jfrog-applications.jfrog.io/jfrog-applications/jfrog-cli/cli-for-jfrog-security/enrich-your-sbom
      # MVN plugin '<artifactId>cyclonedx-maven-plugin</artifactId>' is used to generate SBOM information in the CycloneDX format# target/classes/META-INF/sbom/application.cdx.json
      # ref https://spring.io/blog/2024/05/24/sbom-support-in-spring-boot-3-3
      - name: "Optional: Xray sbom-enrich" 
        continue-on-error: true 
        run: |
          jf se "target/classes/META-INF/sbom/application.cdx.json" --threads=100

      - name: "BuildInfo: Xray - Build scan"
        timeout-minutes: 15    # ref https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepstimeout-minutes
        continue-on-error: true    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepscontinue-on-error
        run: |
          jf bs ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --fail=false --format=table --extended-table=true --vuln=true --project="${{env.PROJECT_KEY}}"

      - name: "Optional: Build Scan V2"  # https://jfrog.com/help/r/xray-rest-apis/scan-build-v2
        # jf xr curl /api/v2/ci/build -H 'Content-Type: application/json' -d '{"build_name": "spring-petclinic", "build_number": "ga-gdl-xray-50","rescan":true }'
        continue-on-error: true 
        run: |
          jf xr curl /api/v2/ci/build -H 'Content-Type: application/json' -d '{"build_name": "${{env.BUILD_NAME}}", "build_number": "${{env.BUILD_ID}}","rescan":false  }'

  mvnPackage:
    name: "Maven Package"
    env:  
      BUILD_ID: "mvn-${{github.run_number}}"
      RT_REPO_VIRTUAL: "bpr-spring-petclinic-mvn-virtual"
      RT_REPO_LOCAL_DEFAULT: "bpr-spring-petclinic-mvn-init-local"
      RT_REPO_LOCAL_DEV: "bpr-spring-petclinic-mvn-dev-local"
      RT_REPO_LOCAL_QA: "bpr-spring-petclinic-mvn-qa-local"
      RT_REPO_LOCAL_PROD: "bpr-spring-petclinic-mvn-prod-local"
      # RT_REPO_REMOTE: bpr-spring-petclinic-mvn-remote
    defaults:
       run:
         working-directory: "${{env.DEFAULT_WORKSPACE}}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: muldos/ci-traffic-monitor@v1
        with:
          detailed: 'true' # optional: 'true' to get detailed output

      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@v5
        id: setup-cli
        env:
          JF_URL: ${{env.JF_RT_URL}}
          JF_PROJECT: "${{env.PROJECT_KEY}}"
          JFROG_CLI_LOG_LEVEL: "${{env.CLI_LOG_LEVEL}}"
          JFROG_CLI_RELEASES_REPO: '${{env.JF_RT_URL}}/artifactory/${{env.RT_REPO_VIRTUAL}}' 
          JFROG_CLI_EXTRACTORS_REMOTE: '${{env.JF_RT_URL}}/artifactory/${{env.RT_REPO_VIRTUAL}}'
          JF_GIT_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          version: latest  #2.71.0
          oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          disable-job-summary: ${{env.JOB_SUMMARY}}

      - name: "Clone VCS"
        uses: actions/checkout@v6 # ref: https://github.com/actions/checkout

      - name: "setUp JDK provider = ${{env.JAVA_DISTRIBUTION}} with ver = ${{env.JAVA_VERSION}}"
        uses: actions/setup-java@v5  # ref https://github.com/actions/setup-java
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}} # temurin
          java-version: ${{env.JAVA_VERSION}}  # 25
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: "Software version"
        run: |
          # JFrog CLI version
          jf --version
          # Ping the server
          jf rt ping
          # Java
          java -version
          # MVN
          mvn -version
          # Docker
          docker -v
          # jf config
          jf config show

      - name: "Config jf with mvn repos"
        run: |
          jf mvnc --global --repo-resolve-releases ${{env.RT_REPO_VIRTUAL}} --repo-resolve-snapshots ${{env.RT_REPO_VIRTUAL}} --repo-deploy-releases ${{env.RT_REPO_VIRTUAL}} --repo-deploy-snapshots ${{env.RT_REPO_VIRTUAL}}

      - name: "list folder"
        run: |
          rm -rf build.gradle
          pwd
          tree .
          echo "ARTIFACT_NAME=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "SHORT_COMMIT_CODE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TODAYS_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: "Curation: audit" 
        timeout-minutes: 15    
        continue-on-error: true  
        run: |
          jf ca --format=table --threads=100
  
      - name: "Xray & JAS: Audit" 
        continue-on-error: true  
        timeout-minutes: 15 
        run: |
          jf audit --mvn --sast=true --sca=true --secrets=true --licenses=true --validate-secrets=true --vuln=true --format=table --extended-table=true --threads=100 --fail=false --project="${{env.PROJECT_KEY}}"

      - name: "Package: Create MVN Build"
        run: |     # -Djar.finalName=${{env.JAR_FINAL_NAME}} 
          jf mvn clean install -DskipTests=true -Denforcer.skip=true -f pom.xml --build-name ${{env.BUILD_NAME}} --build-number ${{env.BUILD_ID}} --project ${{env.PROJECT_KEY}}

      - name: "Package: Junit tests"
        run: |
          jf mvn test -Denforcer.skip
          pwd
          tree ./target/

      - name: "Convert Junit surefire XML reports to JSON format"
        env:
          JUNIT_TEST_RESULTS_JSON: "./target/surefire-reports/test-results.json"
        run: |
          chmod +x ./jfrog/convertXml2Json.sh
          chmod +x ./target/surefire-reports/

          ./jfrog/convertXml2Json.sh ${{env.JUNIT_TEST_RESULTS_JSON}}
          cat ${{env.JUNIT_TEST_RESULTS_JSON}}

      - name: "Package: Xray - mvn Artifact scan"
        timeout-minutes: 15  # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepstimeout-minutes
        continue-on-error: true    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepscontinue-on-error
        run: |
          jf scan . --format=table --extended-table=true --threads=100 --fail=false --vuln=true --project="${{env.PROJECT_KEY}}"

      - name: "Package: Xray - final jar scan"
        timeout-minutes: 15  # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepstimeout-minutes
        continue-on-error: true   # jf scan ./target/spring-petclinic-4.0.0-SNAPSHOT.jar --format=table --extended-table=true --threads=100 --vuln=true
        run: |
          jf scan ./target/${{env.ARTIFACT_NAME}}-${{env.ARTIFACT_VERSION}}.jar --format=table --extended-table=true --threads=100 --fail=false --vuln=true --project="${{env.PROJECT_KEY}}"

      # Build Info
      - name: "BuildInfo: Build Publish"
        run: |
          jf rt bce ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"
          # jf rt bad ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"
          jf rt bag ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}" 
          jf rt bp ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}" --detailed-summary=true 
      
      - name: "Create artifact digest"
        id: create_artifact_digest
        run: |
          ARTIFACT_DIGEST=$(sha256sum "target/${{env.ARTIFACT_NAME}}-${{env.ARTIFACT_VERSION}}.jar" | awk '{print "sha256:"$1}')
          echo "artifact_digest=$ARTIFACT_DIGEST" >> $GITHUB_OUTPUT

      - name: "Evidence: Build Info"
        continue-on-error: true 
        env:
          EVD_JSON: "./target/build-info.json"
          PREDICATE_TYPE: "https://jfrog.com/evidence/signature/v1"
        run: |
          cat ${{env.EVD_JSON}}
          jf evd create --build-name="${{env.BUILD_NAME}}" --build-number="${{env.BUILD_ID}}" --predicate="${{env.EVD_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}"  --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}" --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" --project="${{env.PROJECT_KEY}}"

      - name: "Evidence: cdx"
        continue-on-error: true 
        env:
          EVD_JSON: "./target/classes/META-INF/sbom/application.cdx.json"      # https://jfrog.com/evidence/signature/v1
          PREDICATE_TYPE: "https://cyclonedx.org/bom/v1.4"
        run: |
          cat ${{env.EVD_JSON}}
          jf evd create --build-name="${{env.BUILD_NAME}}" --build-number="${{env.BUILD_ID}}" --predicate="${{env.EVD_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}" --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}" --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" --project="${{env.PROJECT_KEY}}"
          
      - name: "Evidence: Junit Tests results"
        continue-on-error: true 
        env:
          JUNIT_TEST_RESULTS_JSON: "./target/surefire-reports/test-results.json"
          PREDICATE_TYPE: "https://jfrog.com/evidence/test-results/v1"
        run: |
          jf evd create --build-name="${{env.BUILD_NAME}}" --build-number="${{env.BUILD_ID}}" --predicate="${{env.JUNIT_TEST_RESULTS_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}" --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}" --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" --project="${{env.PROJECT_KEY}}"

      - name: "Evidence: Build Publish"
        continue-on-error: true 
        env:
          EVD_SPEC_JSON: './mvn-evd-bp-spec-info.json'  # ref https://jfrog.com/help/r/jfrog-artifactory-documentation/evidence-setup
          PREDICATE_TYPE: "https://jfrog.com/evidence/build-signature/v1"
        run: |
          echo '{ "actor": "${{github.actor}}", "pipeline": "github actions","build_name": "${{env.BUILD_NAME}}", "build_id": "${{env.BUILD_ID}}", "evd": "Evidence-BuildPublish"}' > ${{env.EVD_SPEC_JSON}}
          cat ${{env.EVD_SPEC_JSON}}
          jf evd create --build-name="${{env.BUILD_NAME}}" --build-number="${{env.BUILD_ID}}" --predicate="${{env.EVD_SPEC_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}" --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}" --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" --project="${{env.PROJECT_KEY}}"

      - name: "Optional: Add Builds to Indexing Configuration"
        continue-on-error: true
        run: |
          jf xr curl "/api/v1/binMgr/builds" -H 'Content-Type: application/json' -d '{"names": ["${{env.BUILD_NAME}}"] }'

      - name: "Optional: Query build info"
        env: 
          BUILD_INFO_JSON: "BuildInfo-${{env.BUILD_ID}}.json"
        run: |
           jf rt curl "/api/build/${{env.BUILD_NAME}}/${{env.BUILD_ID}}" -o ${{env.BUILD_INFO_JSON}}
           cat ${{env.BUILD_INFO_JSON}}

      # - name: "Sleep for few seconds"
      #   env: 
      #     SLEEP_TIME: 30
      #   run: |
      #      echo "Sleeping for ${{env.SLEEP_TIME}} seconds..."
      #      sleep ${{env.SLEEP_TIME}}  # Sleeping for 20 seconds before executing the build publish seems to have resolved the build-scan issue. This delay might be helping with synchronization or resource availability, ensuring a smooth build process.
      #      echo "Awake now!"

      - name: "Optional: Query - Build Scan status"
        run: |
          jf xr curl "/api/v1/build/status" -H 'Content-Type: application/json' -d '{"name": "${{env.BUILD_NAME}}", "number": "${{env.BUILD_ID}}" }'
 
      - name: "Optional: Xray sbom-enrich" 
        continue-on-error: true 
        run: |
          jf se "target/classes/META-INF/sbom/application.cdx.json" --threads=100

      - name: "BuildInfo: Xray - Build scan"
        timeout-minutes: 15   
        continue-on-error: true  
        run: |
          jf bs ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --fail=false --format=table --extended-table=true --vuln=true --project="${{env.PROJECT_KEY}}"

      - name: "Optional: Build Scan V2" # https://jfrog.com/help/r/xray-rest-apis/scan-build-v2
        continue-on-error: true 
        run: |
          jf xr curl /api/v2/ci/build -H 'Content-Type: application/json' -d '{"build_name": "${{env.BUILD_NAME}}", "build_number": "${{env.BUILD_ID}}","rescan":false }'

  gradlePackage:
    name: "Gradle Package"
    env:  
      BUILD_ID: "gdl-${{github.run_number}}"
      RT_REPO_VIRTUAL: "bpr-spring-petclinic-gradle-virtual"
      RT_REPO_LOCAL_DEFAULT: "bpr-spring-petclinic-gradle-init-fed"   # federation sites: psazuse, psemea
      RT_REPO_LOCAL_DEV: "bpr-spring-petclinic-gradle-dev-fed"
      RT_REPO_LOCAL_QA: "bpr-spring-petclinic-gradle-qa-fed"
      RT_REPO_LOCAL_PROD: "bpr-spring-petclinic-gradle-prod-fed"
      # RT_REPO_REMOTE: bpr-spring-petclinic-gradle-remote
    defaults:
       run:
         working-directory: "${{env.DEFAULT_WORKSPACE}}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: muldos/ci-traffic-monitor@v1
        with:
          detailed: 'true'
      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@v5
        id: setup-cli
        env:
          JF_URL: ${{env.JF_RT_URL}}
          JF_PROJECT: "${{env.PROJECT_KEY}}"
          JFROG_CLI_LOG_LEVEL: "${{env.CLI_LOG_LEVEL}}"
          JF_GIT_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          version: latest
          oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          disable-job-summary: ${{env.JOB_SUMMARY}}

      - name: "Clone VCS"
        uses: actions/checkout@v6 # ref: https://github.com/actions/checkout

      - name: "setUp JDK provider = ${{env.JAVA_DISTRIBUTION}} with ver = ${{env.JAVA_VERSION}}"
        uses: actions/setup-java@v5  # ref https://github.com/actions/setup-java
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}} # temurin
          java-version: ${{env.JAVA_VERSION}}  # 25
          cache: 'gradle'
          cache-dependency-path: |
            *.gradle
            gradle/**/gradle-wrapper.properties

      - name: "Setup Gradle"    # ref https://docs.github.com/en/enterprise-cloud@latest/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-gradle
        uses: gradle/actions/setup-gradle@v6 # v4.0.0
        with:
          gradle-version: release-candidate
      - name: "Software version"
        run: |
          # JFrog CLI version
          jf --version
          # Ping the server
          jf rt ping
          # Java
          java -version
          # Gradle
          gradle -v
          # jf config
          jf config show

      - name: "Config jf with gradle repos"
        # jf gradlec --repo-deploy springpetclinic-gradle-virtual --repo-resolve springpetclinic-gradle-virtual --repo-deploy springpetclinic-gradle-virtual
        run: |
          jf gradlec --repo-deploy ${{env.RT_REPO_VIRTUAL}} --repo-resolve ${{env.RT_REPO_VIRTUAL}} 

      - name: "list folder"
        run: |
          pwd
          tree .

      # Package   https://docs.jfrog-applications.jfrog.io/jfrog-applications/jfrog-cli/binaries-management-with-jfrog-artifactory/package-managers-integration#running-gradle-builds
      - name: "Package: Create Build" 
        run: |
          jf gradle clean artifactoryPublish -x test --build-name=${{env.BUILD_NAME}} --build-number=${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"

      - name: "Package: Xray - gradle Artifact scan"
        timeout-minutes: 15  # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepstimeout-minutes
        continue-on-error: true    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepscontinue-on-error
        run: |
          jf scan . --format=table --extended-table=true --threads=100 --fail=false --vuln=true --project="${{env.PROJECT_KEY}}" 

      # Build Info
          # US 
          #     Executive Order: 
          #       https://www.whitehouse.gov/briefing-room/presidential-actions/2021/05/12/executive-order-on-improving-the-nations-cybersecurity/
          #       https://www.nist.gov/itl/executive-order-14028-improving-nations-cybersecurity
          #    US Dept of Commerce: https://www.ntia.gov/page/software-bill-materials
          #    US Cyber Defence Agency: https://www.cisa.gov/sbom
          #    NIST: https://www.nist.gov/itl/executive-order-14028-improving-nations-cybersecurity/software-security-supply-chains-software-1
          #    NITA: https://www.ntia.gov/page/software-bill-materials 
          #    Centers for Medicare & Medicaid Services: https://security.cms.gov/learn/software-bill-materials-sbom
          # India
          #    CERT-IN: https://www.cert-in.org.in/sbom/
      - name: "BuildInfo: Build Publish"
        run: |
          jf rt bce ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"
          # jf rt bad ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"
          jf rt bag ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}" 
          jf rt bp ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}" --detailed-summary=true 

      - name: "BuildInfo: Xray - Build scan"
        timeout-minutes: 15   
        continue-on-error: true  
        run: |
          jf bs ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --fail=false --format=table --extended-table=true --vuln=true --project="${{env.PROJECT_KEY}}"

      - name: "Evidence: GitHub Build Attestation"  
        continue-on-error: true
        uses: actions/attest-build-provenance@v3     # https://github.com/marketplace/actions/attest-build-provenance
        with:
          subject-path: |
            ${{ github.workspace }}/build/libs/spring-petclinic-*.jar
            ${{ github.workspace }}/build/build-info.json
            ${{ github.workspace }}/build/reports/application.cdx.json
          show-summary: true
          github-token: ${{secrets.GITHUB_TOKEN}} 

      - name: "Evidence: cdx"
        continue-on-error: true 
        env:
          EVD_JSON: "./build/reports/application.cdx.json"    # https://jfrog.com/help/r/jfrog-artifactory-documentation/evidence-payload
          PREDICATE_TYPE: "https://cyclonedx.org/bom/v1.4"
        run: |
          cat ${{env.EVD_JSON}}
          jf evd create --build-name="${{env.BUILD_NAME}}" --build-number="${{env.BUILD_ID}}" --predicate="${{env.EVD_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}" --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}" --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" --project="${{env.PROJECT_KEY}}"

      - name: "Evidence: Build Publish"
        continue-on-error: true 
        env:
          EVD_SPEC_JSON: './gdl-evd-bp-spec-info.json'  # ref https://jfrog.com/help/r/jfrog-artifactory-documentation/evidence-setup
          PREDICATE_TYPE: "https://jfrog.com/evidence/build-signature/v1"
        run: |
          echo '{ "actor": "${{github.actor}}", "pipeline": "github actions","build_name": "${{env.BUILD_NAME}}", "build_id": "${{env.BUILD_ID}}", "evd": "Evidence-BuildPublish"}' > ${{env.EVD_SPEC_JSON}}
          cat ${{env.EVD_SPEC_JSON}}
          jf evd create --build-name="${{env.BUILD_NAME}}" --build-number="${{env.BUILD_ID}}" --predicate="${{env.EVD_SPEC_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}" --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}" --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" --project="${{env.PROJECT_KEY}}"

  metadata_info:
    name: "Metadata Job Info"
    runs-on: ubuntu-latest
    needs: 
      - dockerPackage
      - mvnPackage
      - gradlePackage
    # Job-level permissions replace workflow defaults. id-token is required for JFrog OIDC.
    # Repo Issues are disabled on ps-jfrog/spring-petclinic, so this job must not call gh issue create.
    # Projects v2 writes need secrets.GH_PROJECT_TOKEN (GITHUB_TOKEN cannot add items).
    permissions:
      actions: read
      id-token: write
      contents: read
    env:
      METADATA_NAME: "bpr-metadata-${{github.run_number}}"
      METADATA_FILE: "bpr_run_number-${{github.run_number}}.txt"
    steps:
      - name: "Write pipeline metadata info"
        run: |
          {
            echo "bpr_run_number=${{ github.run_number }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "commit_sha=${{ github.sha }}"
            echo "branch=${{ github.ref_name }}"
            echo "project_key=${{ env.PROJECT_KEY }}"
            echo "build_name=${{ env.BUILD_NAME }}"
            echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > ${{env.METADATA_FILE}}

      - name: "Show file"
        run: |
          cat ${{env.METADATA_FILE}}

      - name: "Upload run number artifact"
        uses: actions/upload-artifact@v7  # https://github.com/actions/upload-artifact
        with:
          name: ${{env.METADATA_NAME}}
          path: ${{env.METADATA_FILE}}
          retention-days: 7

      - name: "Clone VCS"
        uses: actions/checkout@v6 # ref: https://github.com/actions/checkout

      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: ${{env.JF_RT_URL}}
          JF_PROJECT: "${{env.PROJECT_KEY}}"
          JFROG_CLI_LOG_LEVEL: "${{env.CLI_LOG_LEVEL}}"
        with:
          version: latest
          oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          disable-job-summary: ${{env.JOB_SUMMARY}}

      - name: "setUp JDK provider = ${{env.JAVA_DISTRIBUTION}} with ver = ${{env.JAVA_VERSION}}"
        uses: actions/setup-java@v5  # ref https://github.com/actions/setup-java
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}} # temurin
          java-version: ${{env.JAVA_VERSION}}  # 25
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: "Create ENV variables"
        run: |
          echo "ARTIFACT_NAME=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "SHORT_COMMIT_CODE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "LONG_COMMIT_CODE=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "TODAYS_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: "Pipeline Summary"
        run: |
          echo "# :frog: :ship: BPR: Package - Pipeline Summary :pushpin:" >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " - Installed JFrog CLI [$(jf --version)](https://jfrog.com/getcli/) and Java [${{env.JAVA_DISTRIBUTION}}](https://github.com/actions/setup-java) v${{env.JAVA_VERSION}} " >> $GITHUB_STEP_SUMMARY
          echo "    - $(jf --version) " >> $GITHUB_STEP_SUMMARY
          echo "    - $(mvn -v) " >> $GITHUB_STEP_SUMMARY
          echo "    - $(docker -v) " >> $GITHUB_STEP_SUMMARY
          echo "    - Gradle version: $(./gradlew -v | grep "Gradle" | awk '{print $2}') " >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " - Configured the JFrog Cli with SaaS Artifactory OIDC integration  " >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " - Variables info" >> $GITHUB_STEP_SUMMARY
          echo "    - JPD URL: [https://${{vars.JF_NAME}}.jfrog.io](https://${{vars.JF_NAME}}.jfrog.io) " >> $GITHUB_STEP_SUMMARY
          echo "    - Commit Code (Long): ${{env.LONG_COMMIT_CODE}} " >> $GITHUB_STEP_SUMMARY
          echo "    - Commit Code (Short): ${{env.SHORT_COMMIT_CODE}} " >> $GITHUB_STEP_SUMMARY
          echo "    - Project Key: [${{env.PROJECT_KEY}}](https://${{vars.JF_NAME}}.jfrog.io/ui/admin/projects/overview?projectKey=${{env.PROJECT_KEY}}) " >> $GITHUB_STEP_SUMMARY
          echo "    - Build Name: [${{env.BUILD_NAME}}](https://${{vars.JF_NAME}}.jfrog.io/ui/builds/?projectKey=${{env.PROJECT_KEY}}) " >> $GITHUB_STEP_SUMMARY
          echo "    - Project repositories: [Repositories Info](https://${{vars.JF_NAME}}.jfrog.io/ui/admin/repositories?projectKey=${{env.PROJECT_KEY}}) " >> $GITHUB_STEP_SUMMARY
          echo "    - Docker Info: " >> $GITHUB_STEP_SUMMARY
          echo "      - Build ID: dkr-${{github.run_number}} " >> $GITHUB_STEP_SUMMARY
          echo "      - Repo Virtual URL: [bpr-spring-petclinic-docker-virtual](https://${{vars.JF_NAME}}.jfrog.io/ui/admin/repositories/virtual/bpr-spring-petclinic-docker-virtual/edit?projectKey=${{env.PROJECT_KEY}}) " >> $GITHUB_STEP_SUMMARY
          echo "    - Maven Info: " >> $GITHUB_STEP_SUMMARY
          echo "      - Build ID: mvn-${{github.run_number}} " >> $GITHUB_STEP_SUMMARY
          echo "      - Repo Virtual URL: [bpr-spring-petclinic-mvn-virtual](https://${{vars.JF_NAME}}.jfrog.io/ui/admin/repositories/virtual/bpr-spring-petclinic-mvn-virtual/edit?projectKey=${{env.PROJECT_KEY}}) " >> $GITHUB_STEP_SUMMARY
          echo "    - Gradle Info: " >> $GITHUB_STEP_SUMMARY
          echo "      - Build ID: gdl-${{github.run_number}} " >> $GITHUB_STEP_SUMMARY
          echo "      - Repo Virtual URL: [bpr-spring-petclinic-gradle-virtual](https://${{vars.JF_NAME}}.jfrog.io/ui/admin/repositories/virtual/bpr-spring-petclinic-gradle-virtual/edit?projectKey=${{env.PROJECT_KEY}}) " >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY
          echo " " >> $GITHUB_STEP_SUMMARY

      # Creates a Projects v2 *draft item* (not a repo Issue). GITHUB_TOKEN cannot write
      # projects; store a PAT (scope: project) or GitHub App token as GH_PROJECT_TOKEN.
      # GH_OWNER is the project owner (user frogkris), not the repo owner (org ps-jfrog).
      - name: "Create task in the GitHub Projects"
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          GH_OWNER: "frogkris"  # https://github.com/users/frogkris
          GH_PROJECT_NAME: "Project-PetClinic" # https://github.com/users/frogkris/projects/1
          GH_PROJECT_ID: "1"
          BUILD_ID: "${{ github.run_number }}"
          GH_TASK_NAME: "bpr-${{ env.BUILD_NAME }}-${{ github.run_number }}"
          GH_COLUMN_NAME: "UnAssigned"
          GH_ASSIGNEE: "frogkris"
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::secrets.GH_PROJECT_TOKEN is empty; skipping GitHub Projects task creation. GITHUB_TOKEN cannot write Projects v2, and ${{ github.repository }} has Issues disabled so there is no gh issue create fallback."
            echo "- :warning: GitHub Projects task **skipped** (\`GH_PROJECT_TOKEN\` not configured)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Identify the token before using it: a wrong account or a missing 'project'
          # scope both surface as a generic item-create failure otherwise.
          TOKEN_HEADERS="$(gh api -i user 2>/dev/null | tr -d '\r' || true)"
          TOKEN_LOGIN="$(gh api user --jq '.login' 2>/dev/null || echo 'unknown')"
          TOKEN_SCOPES="$(echo "${TOKEN_HEADERS}" | awk -F': ' 'tolower($1)=="x-oauth-scopes" {print $2}')"
          echo "GH_PROJECT_TOKEN identity: ${TOKEN_LOGIN}"
          echo "GH_PROJECT_TOKEN scopes: ${TOKEN_SCOPES:-<none reported: fine-grained token or invalid>}"
          if [[ "${TOKEN_LOGIN}" == "unknown" ]]; then
            echo "::warning::GH_PROJECT_TOKEN is not a valid GitHub credential (gh api user failed); it may be expired or revoked."
          elif [[ "${TOKEN_LOGIN}" != "${GH_OWNER}" ]]; then
            echo "::warning::GH_PROJECT_TOKEN belongs to '${TOKEN_LOGIN}' but the project is owned by '${GH_OWNER}'. A user-owned Project v2 is only writable by its owner's token."
          fi
          if [[ -n "${TOKEN_SCOPES}" && "${TOKEN_SCOPES}" != *project* ]]; then
            echo "::warning::GH_PROJECT_TOKEN is missing the 'project' scope (has: ${TOKEN_SCOPES})."
          fi

          TASK_BODY=$(cat <<EOF
          BPR package run for **${BUILD_NAME}**.

          | Field | Value |
          | --- | --- |
          | Workflow | ${{ github.workflow }} |
          | Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | Commit | \`${LONG_COMMIT_CODE}\` (\`${SHORT_COMMIT_CODE}\`) |
          | Branch | \`${{ github.ref_name }}\` |
          | Artifact | ${ARTIFACT_NAME}:${ARTIFACT_VERSION} |
          | JFrog project | ${PROJECT_KEY} |
          | JFrog build | ${BUILD_NAME} / ${BUILD_ID} |
          | JPD | ${JF_RT_URL} |
          | Docker build | dkr-${{ github.run_number }} |
          | Maven build | mvn-${{ github.run_number }} |
          | Gradle build | gdl-${{ github.run_number }} |
          | GitHub project | ${GH_PROJECT_NAME} (#${GH_PROJECT_ID}) |
          | Column | ${GH_COLUMN_NAME} |
          | Assignee | @${GH_ASSIGNEE} |
          EOF
          )

          PROJECT_NUMBER="${GH_PROJECT_ID}"
          PROJECT_LIST="$(gh project list --owner "${GH_OWNER}" --limit 100 --format json || echo '{}')"
          RESOLVED_NUMBER="$(echo "${PROJECT_LIST}" \
            | jq -r --arg t "${GH_PROJECT_NAME}" '.projects[]? | select(.title == $t) | .number' | head -n1)"
          if [[ -n "${RESOLVED_NUMBER}" ]]; then
            PROJECT_NUMBER="${RESOLVED_NUMBER}"
          else
            echo "::warning::No project titled '${GH_PROJECT_NAME}' visible to GH_PROJECT_TOKEN under owner '${GH_OWNER}'; falling back to number ${PROJECT_NUMBER}."
            echo "Projects visible to this token under ${GH_OWNER}:"
            echo "${PROJECT_LIST}" | jq -r '.projects[]? | "  #\(.number) \(.title)"'
          fi
          PROJECT_JSON="$(gh project view "${PROJECT_NUMBER}" --owner "${GH_OWNER}" --format json 2>/tmp/gh-project-view.err || echo '{}')"
          [[ -n "${PROJECT_JSON}" ]] || PROJECT_JSON='{}'
          PROJECT_NODE_ID="$(echo "${PROJECT_JSON}" | jq -r '.id // empty')"
          PROJECT_URL="$(echo "${PROJECT_JSON}" | jq -r '.url // empty')"
          if [[ -z "${PROJECT_NODE_ID}" ]]; then
            echo "::warning::Project #${PROJECT_NUMBER} is not readable by GH_PROJECT_TOKEN under owner '${GH_OWNER}'; skipping task creation."
            cat /tmp/gh-project-view.err >&2 || true
            echo "- :warning: GitHub Projects task **skipped** (project #${PROJECT_NUMBER} unreadable)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "Using GitHub Project '${GH_PROJECT_NAME}' number=${PROJECT_NUMBER} owner=${GH_OWNER} id=${PROJECT_NODE_ID}"

          ASSIGNEE_ID="$(gh api graphql -f query='query($l:String!){user(login:$l){id}}' \
            -f l="${GH_ASSIGNEE}" --jq '.data.user.id' 2>/tmp/gh-assignee.err || true)"
          if [[ -z "${ASSIGNEE_ID}" ]]; then
            echo "::warning::Cannot resolve GitHub user '${GH_ASSIGNEE}'; the task will be created unassigned."
            cat /tmp/gh-assignee.err >&2 || true
          fi

          # gh project item-create cannot set assignees (cli/cli#12727), so create the draft
          # issue via GraphQL, where addProjectV2DraftIssue takes assigneeIds in the same call.
          CREATE_QUERY='mutation($project:ID!,$title:String!,$body:String!,$assignees:[ID!]) {
            addProjectV2DraftIssue(input:{projectId:$project,title:$title,body:$body,assigneeIds:$assignees}) {
              projectItem { id content { ... on DraftIssue { id assignees(first:10){nodes{login}} } } }
            }
          }'
          PAYLOAD="$(jq -n \
            --arg query "${CREATE_QUERY}" \
            --arg project "${PROJECT_NODE_ID}" \
            --arg title "${GH_TASK_NAME}" \
            --arg body "${TASK_BODY}" \
            --arg assignee "${ASSIGNEE_ID}" \
            '{query: $query, variables: {project: $project, title: $title, body: $body,
              assignees: (if $assignee == "" then [] else [$assignee] end)}}')"

          set +e
          CREATE_JSON="$(echo "${PAYLOAD}" | gh api graphql --input - 2>/tmp/gh-draft-create.err)"
          CREATE_RC=$?
          set -e
          [[ -n "${CREATE_JSON}" ]] || CREATE_JSON='{}'
          ITEM_ID="$(echo "${CREATE_JSON}" | jq -r '.data.addProjectV2DraftIssue.projectItem.id // empty')"
          if [[ "${CREATE_RC}" -ne 0 || -z "${ITEM_ID}" ]]; then
            echo "::warning::Draft item creation failed for '${GH_TASK_NAME}' on '${GH_PROJECT_NAME}' (#${PROJECT_NUMBER}, owner ${GH_OWNER}). GH_PROJECT_TOKEN needs the full 'project' scope, not just read:project."
            cat /tmp/gh-draft-create.err >&2 || true
            echo "${CREATE_JSON}" >&2
            echo "- :warning: GitHub Projects task **failed** for \`${GH_TASK_NAME}\` (see step log)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          ASSIGNED="$(echo "${CREATE_JSON}" \
            | jq -r '[.data.addProjectV2DraftIssue.projectItem.content.assignees.nodes[]?.login] | join(", ")')"
          echo "Created draft item ${ITEM_ID} on ${PROJECT_URL}"
          echo "Assignees: ${ASSIGNED:-<none>}"
          if [[ -n "${ASSIGNEE_ID}" && -z "${ASSIGNED}" ]]; then
            echo "::warning::Draft item created but '${GH_ASSIGNEE}' was not attached as an assignee."
          fi
          echo "- GitHub Project task \`${GH_TASK_NAME}\` on [${GH_PROJECT_NAME}](${PROJECT_URL}), assignee: ${ASSIGNED:-none}" >> "${GITHUB_STEP_SUMMARY}"

          if [[ -n "${GH_COLUMN_NAME}" ]]; then
            FIELD_JSON="$(gh project field-list "${PROJECT_NUMBER}" --owner "${GH_OWNER}" --format json || echo '{}')"
            [[ -n "${FIELD_JSON}" ]] || FIELD_JSON='{}'
            MATCH="$(echo "${FIELD_JSON}" | jq -r --arg col "${GH_COLUMN_NAME}" '
              .fields[]?
              | select(.options != null)
              | . as $f
              | .options[]
              | select((.name | ascii_downcase) == ($col | ascii_downcase))
              | "\($f.id)\t\(.id)"
            ' | head -n1)"
            FIELD_ID="$(echo "${MATCH}" | cut -f1)"
            OPTION_ID="$(echo "${MATCH}" | cut -f2)"
            if [[ -n "${FIELD_ID}" && -n "${OPTION_ID}" ]]; then
              gh project item-edit \
                --id "${ITEM_ID}" \
                --project-id "${PROJECT_NODE_ID}" \
                --field-id "${FIELD_ID}" \
                --single-select-option-id "${OPTION_ID}"
              echo "Moved item to column '${GH_COLUMN_NAME}'."
            else
              echo "::warning::No single-select option named '${GH_COLUMN_NAME}' on project #${PROJECT_NUMBER}; item left in the default column."
              echo "Available single-select options:"
              echo "${FIELD_JSON}" | jq -r '.fields[]? | select(.options != null) | .name as $f | .options[] | "  \($f): \(.name)"'
            fi
          fi
